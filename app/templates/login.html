{% extends "base.html" %}
{% block title %}Вход — ipmi-web{% endblock %}

{% block content %}
<div class="card narrow" style="max-width: 400px; margin-top: 80px; text-align: center;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="brand" style="font-size: 20px; padding: 6px 14px; background: rgba(229, 57, 53, 0.15); border: 1px solid rgba(229, 57, 53, 0.3); border-radius: 8px; display: inline-flex; align-items: center; gap: 8px;">
            <span class="brand-dot" style="width: 10px; height: 10px; background: var(--accent-red); border-radius: 50%; display: inline-block;"></span>
            <span style="font-weight: 700; color: var(--text-primary);">ipmi-web</span>
        </div>
        <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Переключить тему" style="width: 32px; height: 32px;">
            <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 3.68-2.16 4.67-5.38-1.54-6.73-4.67-8.19c-.31-.14-.64-.23-.97-.28.32-.05.65-.08.97-.08 1.1 0 2.14.24 3.1.66-1.1-2.91-3.92-4.73-7.1-4.73z"/></svg>
        </button>
    </div>
    
    <p class="subtitle" style="margin-bottom: 24px;">Панель аварийного монтирования ISO-образов через BMC</p>
    
    <form method="post" style="text-align: left;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <label>Логин
            <input type="text" name="username" autocomplete="username" autofocus required placeholder="Введите ваш логин">
        </label>
        
        <label>Пароль
            <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        
        <button type="submit" class="button" style="width: 100%; margin-top: 10px; padding: 10px;">Войти в панель</button>
    </form>
    
    <p class="hint" style="margin-top: 20px; font-size: 11px;">5 неудачных попыток входа приведут к временной блокировке IP-адреса.</p>
</div>
{% endblock %}
