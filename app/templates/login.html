{% extends "base.html" %}
{% block title %}Вход — ipmi-web{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>ipmi-web</h1>
    <p class="muted">Монтирование образов через BMC</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Логин<input name="username" autocomplete="username" autofocus required></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
