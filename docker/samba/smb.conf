[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never
   # старые BMC не умеют ничего новее; см. DECISIONS.md
   server min protocol = NT1
   ntlm auth = ntlmv1-permitted
   lanman auth = no
   # Списка разрешённых адресов здесь намеренно нет: единственный источник
   # правды о доступе — множество ikvm.allow в nftables (см. nftables/ikvm.nft).
   # Дублирование сюда означало бы переписывание конфига и перечитывание smbd
   # на каждое монтирование, что способно оборвать уже идущую установку.
   log level = 2
   log file = /dev/stdout
   max log size = 0

[iso]
   path = /srv/iso
   read only = yes
   browseable = yes
   guest ok = no
   valid users = ikvm
