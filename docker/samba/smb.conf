[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never
   # старые BMC не умеют ничего новее; см. DECISIONS.md
   server min protocol = NT1
   ntlm auth = ntlmv1-permitted
   lanman auth = no
   # Второй рубеж поверх nftables. Сюда дописываются адреса BMC, которым
   # разрешено забирать образы, через пробел. Например:
   #   hosts allow = 127.0.0.1 203.0.113.10
   hosts allow = 127.0.0.1
   hosts deny = 0.0.0.0/0
   log level = 2
   log file = /dev/stdout
   max log size = 0

[iso]
   path = /srv/iso
   read only = yes
   browseable = yes
   guest ok = no
   valid users = ikvm
