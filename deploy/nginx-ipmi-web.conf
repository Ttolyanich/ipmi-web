# Пример vhost для панели. Кладётся в /etc/nginx/sites-available/ и
# включается симлинком. Имя и пути к сертификатам подставить свои.
#
# Ключевые места, без которых сервис работает неправильно, отмечены ниже.

# Апгрейд до WebSocket только там, где клиент его действительно просит.
# Безусловный `Connection: upgrade` ломает обычные запросы с keep-alive,
# поэтому используется карта. Блок обязан лежать в http-контексте —
# положить файл в /etc/nginx/conf.d/.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 80;
    server_name ipmi-web.example.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ipmi-web.example.kz;

    ssl_certificate     /etc/letsencrypt/live/ipmi-web.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipmi-web.example.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ipmi-web.access.log;
    error_log  /var/log/nginx/ipmi-web.error.log;

    # ОБЯЗАТЕЛЬНО. Загрузка образов идёт кусками по 8 МБ, а умолчание nginx —
    # 1 МБ: без этой строки любая загрузка падает с 413. Значение согласовано
    # с CHUNK_UPLOAD_LIMIT в app/views/library.py.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:5006;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Приложение берёт отсюда адрес клиента для журнала и ограничения
        # попыток входа.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Операции с BMC небыстрые: монтирование и опрос статуса могут занять
        # десятки секунд. Согласовано с --timeout 300 у gunicorn, иначе nginx
        # оборвёт запрос своим 504 раньше, чем ответит приложение.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
