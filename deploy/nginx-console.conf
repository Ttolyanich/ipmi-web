# Прокси HTML5-консоли BMC. По одному server-блоку на сервер, каждый на своём
# порту. Кладётся в /etc/nginx/conf.d/.
#
# Почему порт, а не префикс пути: вебморда BMC ходит по путям, которые
# резолвятся в корень (`/cgi/...`, `/novnc/...`), и под префиксом вроде
# `/console/1/` их пришлось бы переписывать на лету — включая адрес, который
# JavaScript консоли собирает сам. На своём порту всё работает ровно так же,
# как при прямом обращении к BMC, и переписывать не нужно ничего.
#
# Почему это вообще имеет смысл: если консоль и монтирование идут через
# сервис, у BMC наружу не должно смотреть ничего. См. docs/console.md.
#
# Требуется карта $connection_upgrade из deploy/nginx-ipmi-web.conf.

server {
    # Порт на сервер: 7001, 7002 и так далее.
    listen 7001 ssl;
    http2 on;
    server_name ipmi-web.example.kz;

    # Тот же сертификат, что у панели: браузер перестаёт ругаться на
    # самоподписанный сертификат BMC, потому что TLS к BMC терминируем мы.
    ssl_certificate     /etc/letsencrypt/live/ipmi-web.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipmi-web.example.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ipmi-console-7001.access.log;
    error_log  /var/log/nginx/ipmi-console-7001.error.log;

    location / {
        # Адрес BMC этого сервера.
        proxy_pass https://203.0.113.10;

        # На BMC самоподписанный, часто просроченный сертификат.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Видео и клавиатура идут по WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Прошивка запрещает встраивать себя во фрейм; раз страницу отдаём мы,
        # запрет снимаем — иначе консоль не покажется внутри панели.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Консоль держит соединение открытым всё время работы, а буферизация
        # интерактиву только вредит.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 0;
    }
}
