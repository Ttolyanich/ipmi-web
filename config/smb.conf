[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = never

   # Старые BMC не умеют ничего новее. Протокол-труп заперт в контейнере и
   # доступен только адресам, для которых открыто окно в nftables.
   server min protocol = NT1
   ntlm auth = ntlmv1-permitted
   lanman auth = no

   # Списка разрешённых адресов здесь намеренно нет: единственный источник
   # правды о доступе — множество ikvm_allow в nftables. Дублирование сюда
   # означало бы переписывание конфига и перечитывание smbd на каждое
   # монтирование, что способно оборвать уже идущую установку.

   log level = 1
   log file = /dev/stdout
   max log size = 0

[iso]
   path = /srv/iso
   # Только чтение: писать сюда BMC незачем.
   read only = yes
   browseable = yes
   guest ok = no
   # Доступ даёт членство в группе, поэтому одноразовые учётные записи
   # заводятся и удаляются без правки этого файла.
   valid users = @ikvm
