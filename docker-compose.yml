services:
  # network_mode: host обязателен. При публикации порта через "ports:" трафик
  # идёт через DNAT и цепочку forward, куда Docker сам вписывает ACCEPT, —
  # правила фильтрации в input его не увидят, и 445 окажется открыт всему
  # интернету. См. DECISIONS.md.
  ipmi-web:
    image: ghcr.io/ttolyanich/ipmi-web:latest
    build: .
    container_name: ipmi-web
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      # При network_mode: host проброс портов не применяется — контейнер и так
      # в сети хоста. Ограничение доступности задаётся адресом привязки
      # gunicorn, а не синтаксисом ports.
      BIND_ADDR: ${BIND_ADDR:-127.0.0.1}
      PORT: ${PORT:-5006}
      DATA_DIR: /data
      ISO_DIR: /srv/iso
      FW_SOCKET: /run/ipmi-fw/helper.sock
    volumes:
      - ./data:/data
      - ${ISO_DIR:-/opt/iso}:/srv/iso
      # Сокет хостового демона, управляющего окном в nftables. У контейнера
      # при этом нет NET_ADMIN: он может только попросить открыть порт.
      - /run/ipmi-fw:/run/ipmi-fw
      # Конфиг Samba томом, чтобы правки не требовали пересборки образа.
      - ./config/smb.conf:/etc/samba/smb.conf:ro
