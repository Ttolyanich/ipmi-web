name: build

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  samba:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./docker/samba
          push: true
          # владелец захардкожен строчными: ghcr не принимает заглавные буквы,
          # а github.repository_owner отдаёт их как есть
          tags: ghcr.io/ttolyanich/ipmi-web-samba:latest
